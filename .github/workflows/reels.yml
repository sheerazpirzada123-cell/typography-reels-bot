name: Daily Typography Reel Automation

on:
  schedule:
    - cron: '0 6 * * *' # Roz subah 11:00 AM (Pakistan Time)
  workflow_dispatch:

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (ImageMagick for MoviePy text)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install Python Libraries
        run: pip install -r requirements.txt

      - name: Run Script
        run: python main.py
